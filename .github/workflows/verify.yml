name: Verify
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Static checks
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Benchmark smoke test
        run: make bench
