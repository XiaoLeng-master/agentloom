services:
  # Trace persistence and the optional cache L2 share this Redis.
  # Leave AGENTLOOM_REDIS_ADDR unset to keep caches at L1 only. See docs/11-multilevel-cache.md.
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - agentloom-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

volumes:
  agentloom-redis:
