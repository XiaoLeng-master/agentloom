<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" font-family="'PingFang SC','Microsoft YaHei',-apple-system,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#142A49"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9C2D55"/>
    </marker>
  </defs>

  <!-- 纸面背景 -->
  <rect width="960" height="760" fill="#FFFEF8"/>

  <!-- 标题 -->
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#142A49">agentloom · 多 Agent 运行时 + 自进化评测闭环</text>
  <text x="480" y="60" text-anchor="middle" font-size="12" fill="#5B6B8A">Agent 是决策层，后端基础设施是执行层与神经层</text>

  <!-- ============ 控制面（浅蓝） ============ -->
  <g>
    <rect x="300" y="80" width="360" height="48" rx="10" fill="#EAF6FF" stroke="#142A49" stroke-width="1.6"/>
    <text x="480" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#142A49">🛡️ 网关 Filter Chain</text>
    <text x="480" y="118" text-anchor="middle" font-size="11" fill="#142A49">认证 · Prompt 注入检测 · 两级限流</text>

    <rect x="300" y="144" width="360" height="48" rx="10" fill="#EAF6FF" stroke="#142A49" stroke-width="1.6"/>
    <text x="480" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#142A49">🎛️ 控制面 · Router / Orchestrator</text>
    <text x="480" y="182" text-anchor="middle" font-size="11" fill="#142A49">任务拆解 · 优先级调度 · 租户配额</text>
    <line x1="480" y1="128" x2="480" y2="142" stroke="#142A49" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ 执行面（浅绿） ============ -->
  <text x="40" y="214" font-size="13" font-weight="700" fill="#2F6B2F">🤖 执行面 · 按能力拆池</text>
  <text x="210" y="214" font-size="10" fill="#5B6B8A">真正高并发的不是思考，是调工具 / 写回系统</text>

  <g>
    <rect x="40"  y="226" width="270" height="92" rx="10" fill="#EEF8E8" stroke="#142A49" stroke-width="1.6"/>
    <text x="175" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#2F6B2F">Planner 池 🧠</text>
    <text x="175" y="270" text-anchor="middle" font-size="11" fill="#142A49">贵模型 · 少而精</text>
    <text x="175" y="288" text-anchor="middle" font-size="11" fill="#142A49">规划 / 任务拆解</text>
    <text x="175" y="306" text-anchor="middle" font-size="10" fill="#5B6B8A">实例少，不横向扩</text>

    <rect x="345" y="226" width="270" height="92" rx="10" fill="#EEF8E8" stroke="#142A49" stroke-width="1.6"/>
    <text x="480" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#2F6B2F">Executor 池 ⚙️</text>
    <text x="480" y="270" text-anchor="middle" font-size="11" fill="#142A49">平价模型 · 横向扩</text>
    <text x="480" y="288" text-anchor="middle" font-size="11" fill="#142A49">工具调用 / 写回系统</text>
    <text x="480" y="306" text-anchor="middle" font-size="10" fill="#5B6B8A">高并发承载层</text>

    <rect x="650" y="226" width="270" height="92" rx="10" fill="#EEF8E8" stroke="#142A49" stroke-width="1.6"/>
    <text x="785" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#2F6B2F">Verifier 池 ✓</text>
    <text x="785" y="270" text-anchor="middle" font-size="11" fill="#142A49">规则 + 小模型</text>
    <text x="785" y="288" text-anchor="middle" font-size="11" fill="#142A49">校验 / 敏感操作拦截</text>
    <text x="785" y="306" text-anchor="middle" font-size="10" fill="#5B6B8A">便宜可扩，门禁闸</text>
  </g>
  <g stroke="#142A49" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="480" y1="192" x2="175" y2="224"/>
    <line x1="480" y1="192" x2="480" y2="224"/>
    <line x1="480" y1="192" x2="785" y2="224"/>
  </g>

  <!-- ============ 记忆面（浅黄） ============ -->
  <text x="40" y="346" font-size="13" font-weight="700" fill="#8A6D1F">📚 记忆面</text>
  <g>
    <rect x="40"  y="358" width="270" height="74" rx="10" fill="#FFF8D8" stroke="#142A49" stroke-width="1.6"/>
    <text x="175" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#8A6D1F">会话状态</text>
    <text x="175" y="400" text-anchor="middle" font-size="11" fill="#142A49">Redis + 本地两级</text>
    <text x="175" y="418" text-anchor="middle" font-size="11" fill="#142A49">LaneLock 会话内串行</text>

    <rect x="345" y="358" width="270" height="74" rx="10" fill="#FFF8D8" stroke="#142A49" stroke-width="1.6"/>
    <text x="480" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#8A6D1F">向量库 · Milvus</text>
    <text x="480" y="400" text-anchor="middle" font-size="11" fill="#142A49">Top-K 检索 · 增量更新</text>
    <text x="480" y="418" text-anchor="middle" font-size="11" fill="#142A49">4 种切分策略可插拔</text>

    <rect x="650" y="358" width="270" height="74" rx="10" fill="#FFF8D8" stroke="#142A49" stroke-width="1.6"/>
    <text x="785" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#8A6D1F">多级缓存</text>
    <text x="785" y="400" text-anchor="middle" font-size="11" fill="#142A49">local LRU + Redis</text>
    <text x="785" y="418" text-anchor="middle" font-size="11" fill="#142A49">singleflight 防击穿</text>
  </g>
  <g stroke="#142A49" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)">
    <line x1="175" y1="318" x2="175" y2="356"/>
    <line x1="480" y1="318" x2="480" y2="356"/>
    <line x1="785" y1="318" x2="785" y2="356"/>
  </g>

  <!-- ============ 观测面 / 自进化闭环（浅粉） ============ -->
  <text x="40" y="462" font-size="13" font-weight="700" fill="#9C2D55">📊 观测面 · 自进化闭环</text>
  <text x="210" y="462" font-size="10" fill="#5B6B8A">每一环都有后端技术支撑，无一处堆栈</text>

  <g font-size="10" fill="#142A49">
    <rect x="40"  y="474" width="120" height="48" rx="8" fill="#FCEBF1" stroke="#9C2D55" stroke-width="1.4"/>
    <text x="100" y="493" text-anchor="middle" font-weight="700">① Trace 采集</text>
    <text x="100" y="510" text-anchor="middle" font-size="9" fill="#5B6B8A">工具/LLM/分支</text>

    <rect x="180" y="474" width="120" height="48" rx="8" fill="#FCEBF1" stroke="#9C2D55" stroke-width="1.4"/>
    <text x="240" y="493" text-anchor="middle" font-weight="700">② Kafka 削峰</text>
    <text x="240" y="510" text-anchor="middle" font-size="9" fill="#5B6B8A">异步 · 可回放</text>

    <rect x="320" y="474" width="120" height="48" rx="8" fill="#FCEBF1" stroke="#9C2D55" stroke-width="1.4"/>
    <text x="380" y="493" text-anchor="middle" font-weight="700">③ 批量评测</text>
    <text x="380" y="510" text-anchor="middle" font-size="9" fill="#5B6B8A">62+8 回归集</text>

    <rect x="460" y="474" width="120" height="48" rx="8" fill="#FCEBF1" stroke="#9C2D55" stroke-width="1.4"/>
    <text x="520" y="493" text-anchor="middle" font-weight="700">④ 失败归因</text>
    <text x="520" y="510" text-anchor="middle" font-size="9" fill="#5B6B8A">规则 + Judge</text>

    <rect x="600" y="474" width="120" height="48" rx="8" fill="#FCEBF1" stroke="#9C2D55" stroke-width="1.4"/>
    <text x="660" y="493" text-anchor="middle" font-weight="700">⑤ 优化任务</text>
    <text x="660" y="510" text-anchor="middle" font-size="9" fill="#5B6B8A">Prompt/切分 diff</text>

    <rect x="740" y="474" width="120" height="48" rx="8" fill="#FCEBF1" stroke="#9C2D55" stroke-width="1.4"/>
    <text x="800" y="493" text-anchor="middle" font-weight="700">⑥ 复测门禁</text>
    <text x="800" y="510" text-anchor="middle" font-size="9" fill="#5B6B8A">同集同 case</text>
  </g>
  <g stroke="#9C2D55" stroke-width="1.2" marker-end="url(#arrowR)">
    <line x1="160" y1="498" x2="178" y2="498"/>
    <line x1="300" y1="498" x2="318" y2="498"/>
    <line x1="440" y1="498" x2="458" y2="498"/>
    <line x1="580" y1="498" x2="598" y2="498"/>
    <line x1="720" y1="498" x2="738" y2="498"/>
  </g>

  <!-- 闭环出口：热更新 -->
  <rect x="740" y="544" width="120" height="48" rx="8" fill="#EAF6FF" stroke="#142A49" stroke-width="1.6"/>
  <text x="800" y="563" text-anchor="middle" font-size="11" font-weight="700" fill="#142A49">⑦ 配置热更新</text>
  <text x="800" y="580" text-anchor="middle" font-size="9" fill="#5B6B8A">引用计数 · 灰度生效</text>
  <line x1="800" y1="522" x2="800" y2="542" stroke="#9C2D55" stroke-width="1.2" marker-end="url(#arrowR)"/>

  <!-- 闭环回流：热更新 -> 控制面 -->
  <path d="M800,544 C905,480 905,300 860,250 C840,224 700,160 642,160" fill="none" stroke="#142A49" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="918" y="384" text-anchor="middle" font-size="10" font-weight="700" fill="#142A49">闭环</text>
  <text x="918" y="398" text-anchor="middle" font-size="9" fill="#5B6B8A">优化结果灰度生效</text>

  <!-- ============ 后端底座（浅紫） ============ -->
  <rect x="40" y="612" width="880" height="58" rx="10" fill="#F0EDFF" stroke="#142A49" stroke-width="1.6"/>
  <text x="60" y="635" font-size="13" font-weight="700" fill="#5B3FA8">🧱 后端底座 · 横切所有面</text>
  <text x="60" y="656" font-size="11" fill="#142A49">并发池(worker pool + 信号量) · MQ 削峰 + DLQ · Trace 按月分表 · 评测幂等消费 · 缓存一致性(版本号 + 事件驱动失效)</text>

  <!-- 图例 -->
  <g font-size="10" fill="#5B6B8A">
    <rect x="40"  y="690" width="14" height="10" fill="#EAF6FF" stroke="#142A49"/><text x="60" y="699">控制面</text>
    <rect x="130" y="690" width="14" height="10" fill="#EEF8E8" stroke="#142A49"/><text x="150" y="699">执行面</text>
    <rect x="220" y="690" width="14" height="10" fill="#FFF8D8" stroke="#142A49"/><text x="240" y="699">记忆面</text>
    <rect x="310" y="690" width="14" height="10" fill="#FCEBF1" stroke="#142A49"/><text x="330" y="699">观测面/闭环</text>
    <rect x="430" y="690" width="14" height="10" fill="#F0EDFF" stroke="#142A49"/><text x="450" y="699">后端底座</text>
    <text x="560" y="699">━━ 实时调用    ┄┄ 闭环回流</text>
  </g>
</svg>
